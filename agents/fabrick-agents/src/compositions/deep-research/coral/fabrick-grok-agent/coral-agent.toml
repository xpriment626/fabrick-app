edition = 4

[agent]
name = "fabrick-grok-agent"
version = "0.1.0"
description = "Fabrick specialist for X/Twitter sentiment via xAI Grok + x_search (auto-wired by OpenRouter for x-ai/* models)."
readme = "Fabrick Grok specialist"
summary = "Live X/Twitter signal via Grok"

[agent.license]
type = "text"
text = "Apache-2.0"

[options.auto_launch]
type = "string"
default = "false"

[runtimes.executable]
path = "bash"
arguments = ["startup.sh"]
transport = "streamable_http"

# Grok routes through the OpenRouter fallback in coral-server (Coral
# Cloud's hosted OpenAI proxy is OpenAI-only, so x-ai/* models fall
# through to OpenRouter which has allowAnyModel = true).
[[llm.proxies]]
name = "MAIN"
format.type = "OpenAI"
models = ["x-ai/grok-4.3"]
