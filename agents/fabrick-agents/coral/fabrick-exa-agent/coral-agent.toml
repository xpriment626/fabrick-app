edition = 4

[agent]
name = "fabrick-exa-agent"
version = "0.1.0"
description = "Fabrick specialist for general web search and webpage fetching via Exa's hosted MCP."
readme = "Fabrick Exa specialist"
summary = "Web search via Exa"

[agent.license]
type = "text"
text = "Apache-2.0"

[options.auto_launch]
type = "string"
default = "false"

[runtimes.executable]
path = "bash"
arguments = ["startup.sh"]
transport = "streamable_http"

[[llm.proxies]]
name = "MAIN"
format.type = "OpenAI"
models = ["anthropic/claude-haiku-4.5"]
