edition = 4

[agent]
name = "fabrick-token-info-agent"
version = "0.1.0"
description = "Fabrick specialist for Solana SPL token prices and metadata via Jupiter."
readme = "Fabrick token-info specialist (Jupiter)"
summary = "Solana token prices and metadata"

[agent.license]
type = "text"
text = "Apache-2.0"

[options.auto_launch]
type = "string"
default = "false"

[runtimes.executable]
path = "bash"
arguments = ["startup.sh"]
transport = "streamable_http"

[[llm.proxies]]
name = "MAIN"
format.type = "OpenAI"
models = ["anthropic/claude-haiku-4.5"]
