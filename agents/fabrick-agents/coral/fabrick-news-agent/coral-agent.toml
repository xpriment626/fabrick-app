edition = 4

[agent]
name = "fabrick-news-agent"
version = "0.1.0"
description = "Fabrick specialist for curated crypto news and sentiment via CoinDesk Data API."
readme = "Fabrick CoinDesk news specialist"
summary = "Crypto news + sentiment via CoinDesk"

[agent.license]
type = "text"
text = "Apache-2.0"

[options.auto_launch]
type = "string"
default = "false"

[runtimes.executable]
path = "bash"
arguments = ["startup.sh"]
transport = "streamable_http"

[[llm.proxies]]
name = "MAIN"
format.type = "OpenAI"
models = ["deepseek/deepseek-v4-pro"]
