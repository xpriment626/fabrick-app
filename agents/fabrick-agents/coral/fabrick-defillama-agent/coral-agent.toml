edition = 4

[agent]
name = "fabrick-defillama-agent"
version = "0.1.0"
description = "Fabrick specialist for multichain DeFi metrics via DefiLlama (TVL, yield pools, DEX volumes, multichain coin prices)."
readme = "Fabrick DefiLlama specialist"
summary = "Multichain DeFi metrics"

[agent.license]
type = "text"
text = "Apache-2.0"

[options.auto_launch]
type = "string"
default = "false"

[runtimes.executable]
path = "bash"
arguments = ["startup.sh"]
transport = "streamable_http"

[[llm.proxies]]
name = "MAIN"
format.type = "OpenAI"
models = ["anthropic/claude-haiku-4.5"]
